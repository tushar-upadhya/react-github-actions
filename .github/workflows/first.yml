name: "first-workflow"

on:
  push:
    branches: [main]

  pull_request:
    branches: [main, dev, qa]

jobs:
  lint-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build-job:
    needs: [lint-job, test-job]

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production build
        run: npm run build

      - name: Create artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: dist/
          retention-days: 7

  deploy-job:
    needs: [lint-job, test-job, build-job]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deployment on Vercel
        run: vercel --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
